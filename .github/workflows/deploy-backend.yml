name: Deploy Backend

# Run on every push to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm ci
        working-directory: backend
        
      - name: Debug AWS identity & buckets
        run: |
          echo "Caller identity:"
          aws sts get-caller-identity
          echo "List S3 buckets:"
          aws s3 ls

      - name: Deploy with Serverless
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI:  ${{ secrets.SPOTIFY_REDIRECT_URI }}
          FRONTEND_URL:          ${{ secrets.FRONTEND_URL }}
          OPENWEATHER_API_KEY:   ${{ secrets.OPENWEATHER_API_KEY }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          ML_LAMBDA_ARN:         ${{ secrets.ML_LAMBDA_ARN }}
          SYNC_LAMBDA_ARN:       ${{ secrets.SYNC_LAMBDA_ARN }}
          KMS_KEY_ARN:           ${{ secrets.KMS_KEY_ARN }}
        run: npx serverless deploy --stage dev
        working-directory: backend

  deploy-python:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Build scikit-learn Lambda Layer
        run: |
          mkdir -p backend-python/layers
          docker run --rm \
            -v ${{ github.workspace }}/backend-python:/var/task \
            public.ecr.aws/lambda/python:3.11 \
            pip install scikit-learn==1.4.2 numpy==1.26.4 scipy==1.13.0 openai==1.30.0 boto3==1.34.0 \
              -t /var/task/python/
          cd backend-python && zip -r layers/sklearn-layer.zip python/ && rm -rf python/

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy Python Lambda
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx serverless deploy --stage dev
        working-directory: backend-python
